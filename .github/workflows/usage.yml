name: Usage report

# Monthly free-tier usage report (scripts/usage): GitHub Actions minutes, Cloudflare Workers /
# D1 / R2 (GraphQL Analytics API) and agent LLM tokens, against data/free-tier-limits.json.
# - Anything ≥ 70% opens/updates one Issue labelled needs-owner + type:infra + type:alert.
# - The report (company/reports/usage/<YYYY-MM>.md) goes to the job summary and an artifact.
#   Once the agents' GitHub App exists (variable AGENT_APP_ID, ADR-015) it is also proposed
#   as a PR from agent/controller/usage-<YYYY-MM>. Nothing is ever pushed to main.
# Scheduled runs are skipped (0 minutes) until Cloudflare is set up (WAITLIST_D1_ID) or agents
# are switched on (AGENTS_ENABLED=true). Each collector skips itself when its token is missing.
on:
  schedule:
    - cron: '23 3 1 * *' # 1st of the month, 03:23 UTC → reports the previous month
  workflow_dispatch:
    inputs:
      month:
        description: '"current" (month to date), "previous", or YYYY-MM'
        required: false
        default: current

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: usage-report
  cancel-in-progress: false

jobs:
  report:
    name: Collect, report, alert
    if: github.event_name != 'schedule' || vars.WAITLIST_D1_ID != '' || vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Run usage monitor
        id: usage
        env:
          MONTH: ${{ github.event_name == 'schedule' && 'previous' || inputs.month }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/usage/src/main.mjs --month "${MONTH:-previous}" --alert
      - name: Job summary
        env:
          REPORT: ${{ steps.usage.outputs.report }}
        run: cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: usage-report
          path: ${{ steps.usage.outputs.report }}
          retention-days: 90
          if-no-files-found: error

      # ---- Optional: propose the report as a PR (needs the agents' GitHub App, ADR-015) ----
      - name: Mint GitHub App token
        id: app
        if: vars.AGENT_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - name: Open PR with the report
        if: vars.AGENT_APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          MONTH: ${{ steps.usage.outputs.month }}
          REPORT: ${{ steps.usage.outputs.report }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch="agent/controller/usage-$MONTH"
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$REPORT"
          if git diff --cached --quiet; then
            echo "::notice::Report unchanged from $BASE; no PR needed."
            exit 0
          fi
          git commit -m "docs: free-tier usage report $MONTH"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq length)" = "0" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$branch" \
              --title "docs: free-tier usage report $MONTH" \
              --label "agent:controller" \
              --body "Monthly free-tier usage report generated by \`.github/workflows/usage.yml\` ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). Data only — no secrets or personal data. Merge to keep it in \`company/reports/usage/\`."
          else
            echo "::notice::PR for $branch already open; branch updated."
          fi
