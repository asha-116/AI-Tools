name: Agent — Controller

# Daily books (agents/controller/PROCEDURE.md): Razorpay payments/refunds/settlements → ledger
# CSVs, reconciliation against the D1 delivery log, weekly P&L on Mondays (IST), PR on
# agent/controller/<date>. Skips itself ("not configured") until the Razorpay keys, the
# Cloudflare token/account and vars.ORDERS_D1_ID exist. Runs only when vars.AGENTS_ENABLED ==
# 'true'; dry-run unless vars.AGENTS_LIVE == 'true' and the agents' GitHub App is set up.
on:
  schedule:
    - cron: '7 18 * * *' # 18:07 UTC ≈ 23:37 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    if: vars.AGENTS_ENABLED == 'true'
    uses: ./.github/workflows/agent-run.yml
    with:
      agent: controller
    secrets: inherit
