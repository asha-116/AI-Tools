name: Waitlist report

# Daily count of waitlist sign-ups per idea and language (scripts/waitlist-report.mjs), shown in
# this run's summary. Counts only — the email column is never read, and nothing is committed.
# Scheduled runs are skipped until the waitlist database exists (vars.WAITLIST_D1_ID).
on:
  schedule:
    - cron: '23 2 * * *' # 02:23 UTC (07:53 IST)
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER: npx --yes wrangler@4.143.0

jobs:
  report:
    name: Count sign-ups
    if: github.event_name != 'schedule' || vars.WAITLIST_D1_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WAITLIST_D1_ID: ${{ vars.WAITLIST_D1_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Count
        run: node scripts/waitlist-report.mjs | tee -a "$GITHUB_STEP_SUMMARY"
